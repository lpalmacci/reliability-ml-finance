# Exploratory (not pre-registered, deviation D2): non-causal ablation without the 16-unit
# bottleneck of the pre-registered G2, which collapsed to near-deterministic paths.
model: InfoCVAE
encoder: CMLP
decoder: CMLP
conditioner: Id
prior: RealNVP
discriminator: null
data_dim: 1
data_length: 60
latent_dim: 2
latent_length: 60
condition_dim: 1
alpha: 0.8
beta: 0.08
transform: log
inv_transform: exp
optimizer: Adam
lr: 0.001
train_batch_size: 256
eval_batch_size: 256
epochs: 500
C_input_dim: 0
C_hidden_dim: 0
C_num_layers: 0
C_output_dim: 0
E_input_dim: 1
E_hidden_dim: 256
E_num_layers: 2
E_output_dim: 2
D_input_dim: 2
D_hidden_dim: 256
D_num_layers: 2
D_output_dim: 1
P_latent_dim: null
P_num_flows: 3
P_hidden_dim: 250
