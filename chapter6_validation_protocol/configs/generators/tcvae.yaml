# G1: Time-Causal VAE (Acciaio, Eckstein and Hou, 2026). Hyperparameters of the
# authors' Heston configuration (configs/Hestonprice/infocvae.yaml, commit a43effe).
model: InfoCVAE
encoder: CLSTMRes
decoder: CLSTMRes
conditioner: Id
prior: RealNVP
discriminator: null
data_dim: 1
data_length: 60
latent_dim: 2
latent_length: 60
condition_dim: 1
alpha: 0.8
beta: 0.08
transform: log
inv_transform: exp
optimizer: Adam
lr: 0.001
train_batch_size: 256
eval_batch_size: 256
epochs: 500
C_input_dim: 0
C_hidden_dim: 0
C_num_layers: 0
C_output_dim: 0
E_input_dim: 1
E_hidden_dim: 16
E_num_layers: 2
E_output_dim: 2
D_input_dim: 2
D_hidden_dim: 16
D_num_layers: 2
D_output_dim: 1
P_latent_dim: null
P_num_flows: 3
P_hidden_dim: 250
