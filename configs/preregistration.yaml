# Pre-registration of the task-aware validation protocol and of its experiments.
# This file is committed (git tag `prereg`) BEFORE any experiment E1-E7 is run.
# Every later change is recorded in docs/DEVIATIONS.md with date and reason.

protocol_version: 1
master_seed: 20261014
mode: S                      # stationary target law (generators unconditional on the past)

data:
  periods_per_year: 252
  context_returns: 500       # T0: history on which a rule is calibrated
  carry: 200                 # context log-prices prepended to each scenario (indicator warm-up)
  scenario_prices: 60        # scenario of 60 prices = 59 daily log-returns
  history_returns: 5040      # single-history regime: one path of 20 years per seed
  train_returns: 2520        # first 10 years train the generators; the rest is held out for L4
  rich_paths: 2560           # rich regime: independent stationary paths of 60 prices

dgps:                        # D1-D4, long-run annual volatility about 18-20%
  gbm:         {name: gbm, mu: 0.07, sigma: 0.18}
  heston:      {name: heston, mu: 0.07, kappa: 3.0, theta_v: 0.04, xi: 0.4, rho: -0.7, substeps: 10}
  gjr_garch_t: {name: gjr_garch_t, mu_ann: 0.07, vol_ann: 0.18, alpha: 0.02, gamma: 0.12, beta: 0.90, nu: 6.0, burn: 500}
  regime:      {name: regime, p11: 0.99, p22: 0.97, mu1: 0.15, sigma1: 0.12, mu2: -0.20, sigma2: 0.30}

use:                         # the declared use U = (rules, objective, metrics, tolerances)
  strategies:
    TF:  {fast: [5, 10, 20], slow: [40, 60, 120], dz: [0.0, 0.005, 0.01]}
    VT:  {lb: [10, 20, 60], target: [0.10, 0.15, 0.20], lmax: [1.0, 2.0]}
    TVF: {fast: [10, 20], slow: [60, 120], dz: [0.0, 0.005], lb: [20, 60], q: [0.8, 0.9]}
  objective: {turnover_weight: 0.01, dd_weight: 1.0}   # J = Sharpe - 0.01 turnover - MaxDD
  cost: 0.0
  functionals:
    sharpe: [mean, q05, q50, q95]
    maxdd:  [mean, q95]
    ret:    [mean, var95, es95]
  tolerances:                # economic tolerances eta (Sharpe and MaxDD agreed with the author)
    sharpe: {mean: 0.05, q50: 0.05, q05: 0.15, q95: 0.15}
    maxdd:  {mean: 0.01, q95: 0.02}
    ret:    {mean: 0.005, var95: 0.01, es95: 0.01}
    regret: 0.05             # regret of J in L3

protocol:
  L0:
    resolvability_ratio: 0.5 # half-width of the 90% interval must be <= eta / 2
    max_N: 100000
  L1:
    n_paths: 5000
    b_null: 100              # replicate pairs (oracle vs independent oracle) for the null law
    level: 0.05
    holm: true
    hill_fraction: 0.05
    acf_lags: 5
    acf_abs_lags: 20
    leverage_lags: 10
    aggregation: [5, 20]
    distances: [marginal_w1, swd_logpath, signature_mmd]
    swd_projections: 100
  L2: {N: 40000, K: 50, tost_level: 0.05, pr_min: 0.9}
  L3: {N: 40000, K: 10, level: 0.05, pr_min: 0.9}
  L4: {N: 10000, n_origins: 42, level: 0.05, interval: [0.05, 0.95], holm: true}

generators:
  tcvae:     {config: generators/tcvae.yaml, seeds: 5, regimes: [single, rich]}
  vae_mlp:   {config: generators/vae_mlp.yaml, seeds: 3, regimes: [single]}
  bootstrap: {seeds: 5, regimes: [single]}
  garch:     {seeds: 5, regimes: [single], burn: 500}
  final_model: last_epoch    # as in the original trainer
  scaling_rule:              # decided on D1 only, then frozen for every process
    decide_on: gbm
    regime: rich
    max_rel_vol_error: 0.20
    fallback_power_k: 4.582576   # sqrt(21): monthly-equivalent scale of the original configs

meta_validation:
  defects: [P1, P2, P3, P4, P5, P6]
  severities: [0.0, 0.25, 0.5, 0.75, 1.0]
  K: 50
  N: 40000
  true_discrepancy_N: 200000
  l4_histories: 20
  l4_defects: [[P5, 1.0], [P1, 1.0], [P2, 1.0]]

robustness:                  # E7
  cost: 0.001
  objectives: [{turnover_weight: 0.005, dd_weight: 0.5}, {turnover_weight: 0.02, dd_weight: 2.0}]
  tolerance_scales: [0.5, 2.0]
  N_alt: 10000

hypotheses:                  # reported whatever the outcome
  H1: >-
    Size. Under the negative control the flag rate of every L1 statistic is at most 5% plus
    Monte Carlo error (at most 9% with K = 50); the L2 non-equivalence rate is at most 10%;
    the L3 regret is within the tolerance in at least 95% of contexts.
  H2: >-
    P1 (shuffle). Marginal W1 is blind at every severity (power close to size). ACF(|r|) and
    leverage reach power >= 0.8 for delta >= 0.5 on D2-D4. In L2, MaxDD of VT and TVF is not
    equivalent at delta = 1 on D3 and D4. On D1, power is close to size everywhere.
  H3: >-
    P5 (volatility scale). L1 flags from delta = 0.25. In L2 the mean Sharpe of VT stays
    equivalent up to delta = 1, while the mean MaxDD of BH is not equivalent for delta >= 0.5.
  H4: >-
    P2 (thinner tails, D3). Hill index and kurtosis flag. In L2 the tail functionals (q95 of
    MaxDD, VaR and ES of the return) are non-equivalent only at large delta; means stay equivalent.
  H5: >-
    P3 (leverage removed). The leverage statistic flags. The L2 effect is small for BH and VT;
    for TVF the outcome is open (no directional hypothesis).
  H6: >-
    P4 (lower persistence). ACF(|r|) flags. In L2, TVF and VT are not equivalent at delta = 1.
  H7: >-
    P6 (drift). L1 is nearly blind except for the mean. In L2 the mean Sharpe of BH is not
    equivalent for delta >= 0.25.
