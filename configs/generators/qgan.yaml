# G3: Quant GAN, pure TCN (Wiese et al., 2020), implemented from the paper (tavp.generators.qgan).
# Specified by the paper (Appendix B, Section 7.2): architecture, noise dimension, preprocessing.
noise_dim: 3
hidden: 80
# Not reported in the paper. Starting values from the public replication of Cascha (2021),
# github.com/ICascha/QuantGANs-replication (no code reused): Adam with betas (0, 0.9), batch 64,
# discriminator learning rate 1e-4. The generator learning rate and the weight of the R1 penalty are
# set by the fidelity check Q0 on the data of the paper (tavp.experiments.q0_fidelity), before any
# experiment of the protocol.
lr_d: 1.0e-4
lr_g: 1.0e-4
betas: [0.0, 0.9]
batch: 64
r1_gamma: 1.0
steps: 6000
checkpoint_every: 250
# Checkpoint selection on the training data, with the metrics of Table 2 of the paper (mean rank).
select_paths: 200
select_length: 2000
select_lags: 250
select_horizons: [1, 5, 20, 100]
select_metrics: [emd_1, emd_5, emd_20, emd_100, dy_1, dy_5, dy_20, dy_100, acf_id, acf_abs, acf_sq, leverage]
device: auto
