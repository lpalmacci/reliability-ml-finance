[project]
name = "tavp"
version = "0.1.0"
description = "Task-aware validation protocol for generative models of financial time series"
authors = [{ name = "Luca Palmacci" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.5.1",
    "numpy==2.1.3",
    "scipy==1.14.1",
    "pandas==2.2.3",
    "pot==0.9.4",
    "arch==7.2.0",
    "matplotlib==3.9.2",
    "ml-collections==0.1.1",
    "pyyaml==6.0.2",
    "tqdm==4.66.6",
    "scikit-learn==1.5.2",
    "joblib==1.4.2",
    "pyarrow==18.1.0",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tavp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
